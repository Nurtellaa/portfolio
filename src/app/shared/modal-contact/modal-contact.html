<div class="modal-overlay" [class.active]="isActive">
  <div class="modal" (click)="preventClose($event)">
    <div class="modal-header">
      <button class="close-btn" (click)="forceClose()">X</button>
    </div>
    <div class="modal-content">
      
      <!-- Show forms if success -->
      <form *ngIf="!showSuccess" (ngSubmit)="sendEmail($event)" #emailForm="ngForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <input type="hidden" id="time" name="time" [value]="currentTime">

        <button type="submit" [disabled]="isSending">
          {{ isSending ? 'Sending...' : 'Send' }}
        </button>
      </form>

      <!--Status message -->
      <div *ngIf="statusMessage" 
           [class]="'status-message ' + (showSuccess ? 'success' : showError ? 'error' : 'loading')">
        <div class="message-content">
          <span class="icon">
            {{ showSuccess ? '✅' : showError ? '❌' : '⏳' }}
          </span>
          <span class="text">{{ statusMessage }}</span>
        </div>
        
        <!-- Action buttons -->
        <div *ngIf="showSuccess || showError" class="action-buttons">
          <button *ngIf="showSuccess" (click)="forceClose()" class="btn-close">
            Close
          </button>
          <button *ngIf="showError" (click)="statusMessage = ''; showError = false" class="btn-retry">
            Try Again
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
